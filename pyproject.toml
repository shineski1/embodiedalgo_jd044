[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shineski1-embodiedalgo_jd044"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出具身智能算法工程师·线上分布漂移的检测上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "shineski1" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://shineski1.github.io"
Repository = "https://github.com/shineski1/embodiedalgo_jd044"
Issues = "https://github.com/shineski1/embodiedalgo_jd044/issues"

[project.scripts]
embodiedalgo_jd044 = "embodiedalgo_jd044:main"

[tool.setuptools]
py-modules = ["embodiedalgo_jd044"]
